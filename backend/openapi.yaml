openapi: 3.1.0
info:
  title: Lore Processing API
  version: 1.0.0
  description: Request-ephemeral transcription and grounded daily-entry processing.
servers:
  - url: https://lore-api.example.invalid
paths:
  /v1/health:
    get:
      operationId: health
      responses:
        "200":
          description: Content-free service status.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status, api_schema_versions, model_aliases]
                properties:
                  status: { const: ok }
                  api_schema_versions:
                    type: array
                    items: { type: string }
                  model_aliases:
                    type: array
                    items: { type: string }
  /v1/auth/challenges:
    post:
      operationId: createAppAttestChallenge
      description: Issues a randomized single-use challenge. Assertion challenges are bound to an opaque App Attest key reference.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChallengeRequest"
      responses:
        "200":
          description: A challenge that expires within five minutes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChallengeResponse"
        default:
          $ref: "#/components/responses/ApiError"
  /v1/auth/attestations:
    post:
      operationId: registerAppAttestKey
      description: Atomically consumes an attestation challenge, registers verified key state, and issues an anonymous installation session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttestationRequest"
      responses:
        "200":
          description: Short-lived anonymous installation session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        default:
          $ref: "#/components/responses/ApiError"
  /v1/auth/sessions:
    post:
      operationId: renewAppAttestSession
      description: Verifies a fresh App Attest assertion and atomically consumes its challenge while advancing the key counter.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionRequest"
      responses:
        "200":
          description: Renewed short-lived anonymous installation session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        default:
          $ref: "#/components/responses/ApiError"
  /v1/transcriptions:
    post:
      operationId: createTranscription
      description: Provider-neutral request contract currently fulfilled by direct Groq Whisper transcription.
      security: [{ bearerSession: [] }]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/TranscriptionMultipart"
      responses:
        "200":
          description: One validated transcription chunk.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemoteTranscriptionResponse"
        "409":
          $ref: "#/components/responses/ApiError"
        default:
          $ref: "#/components/responses/ApiError"
  /v1/daily-entries:
    post:
      operationId: createDailyEntry
      description: Provider-neutral request contract currently fulfilled by direct Fireworks Chat Completions.
      security: [{ bearerSession: [] }]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: DailyEntryGenerationRequest v1.0; canonical validation lives in src/contracts/daily-entry.ts.
      responses:
        "200":
          description: Schema-validated grounded daily entry.
          content:
            application/json:
              schema:
                type: object
                description: DailyEntryGenerationResponse v1.0; canonical validation lives in src/contracts/daily-entry.ts.
        "409":
          $ref: "#/components/responses/ApiError"
        default:
          $ref: "#/components/responses/ApiError"
components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Bounded caller job identity. Daily entry requires `daily-entry:<job_id>`; transcription must exactly match the multipart field.
      schema:
        type: string
        minLength: 8
        maxLength: 200
        pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]*$"
  securitySchemes:
    bearerSession:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Short-lived HS256 token issued only after App Attest attestation or assertion verification. Preview bearer credentials are rejected in production.
  responses:
    ApiError:
      description: Stable content-free error response.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
  schemas:
    ChallengeRequest:
      type: object
      additionalProperties: false
      required: [schema_version, purpose, key_id]
      properties:
        schema_version: { const: "1.0" }
        purpose: { enum: [attestation, assertion] }
        key_id:
          type: [string, "null"]
          description: Canonical standard-base64 32-byte key identifier; required only for assertion challenges.
    ChallengeResponse:
      type: object
      additionalProperties: false
      required: [schema_version, challenge_id, challenge, purpose, expires_at]
      properties:
        schema_version: { const: "1.0" }
        challenge_id: { type: string, format: uuid }
        challenge: { type: string, description: Base64url text hashed as UTF-8 by the App Attest client. }
        purpose: { enum: [attestation, assertion] }
        expires_at: { type: string, format: date-time }
    AttestationRequest:
      type: object
      additionalProperties: false
      required: [schema_version, challenge_id, challenge, key_id, attestation_object]
      properties:
        schema_version: { const: "1.0" }
        challenge_id: { type: string, format: uuid }
        challenge: { type: string }
        key_id: { type: string }
        attestation_object: { type: string, contentEncoding: base64 }
    SessionRequest:
      type: object
      additionalProperties: false
      required: [schema_version, challenge_id, challenge, key_id, assertion_object, client_data]
      properties:
        schema_version: { const: "1.0" }
        challenge_id: { type: string, format: uuid }
        challenge: { type: string }
        key_id: { type: string }
        assertion_object: { type: string, contentEncoding: base64 }
        client_data:
          type: string
          contentEncoding: base64
          description: Exact UTF-8 JSON bytes signed by App Attest; strict schema is {schema_version, action=create_session, challenge_id, challenge}.
    SessionResponse:
      type: object
      additionalProperties: false
      required: [schema_version, token_type, session_token, expires_at]
      properties:
        schema_version: { const: "1.0" }
        token_type: { const: Bearer }
        session_token: { type: string }
        expires_at: { type: string, format: date-time }
    RetentionPolicy:
      type: object
      additionalProperties: false
      required: [mode, maximum_retention_seconds]
      properties:
        mode: { const: request_ephemeral }
        maximum_retention_seconds: { const: 0 }
    TranscriptionMultipart:
      type: object
      additionalProperties: false
      required:
        - audio
        - schema_version
        - job_id
        - idempotency_key
        - chunk_id
        - chunk_index
        - chunk_count
        - start_milliseconds
        - duration_milliseconds
        - vocabulary_hints
        - retention_policy
      properties:
        audio: { type: string, contentEncoding: binary }
        schema_version: { const: "1.0" }
        job_id: { type: string, format: uuid }
        idempotency_key:
          type: string
          minLength: 8
          maxLength: 200
          pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]*$"
          description: Must exactly match the Idempotency-Key header.
        chunk_id: { type: string }
        chunk_index: { type: integer, minimum: 0 }
        chunk_count: { type: integer, minimum: 1 }
        start_milliseconds: { type: integer, minimum: 0 }
        duration_milliseconds: { type: integer, minimum: 1 }
        language_code: { type: [string, "null"] }
        vocabulary_hints: { type: string, description: JSON-encoded bounded string array. }
        retention_policy: { type: string, description: JSON-encoded RetentionPolicy. }
    RemoteTranscriptionResponse:
      type: object
      description: Canonical strict schema lives in src/contracts/transcription.ts.
    ApiError:
      type: object
      additionalProperties: false
      required: [schema_version, request_id, error, retry_after_seconds]
      properties:
        schema_version: { const: "1.0" }
        request_id: { type: string }
        error:
          type: object
          additionalProperties: false
          required: [code, message, retryable]
          properties:
            code: { type: string }
            message: { type: string }
            retryable: { type: boolean }
        retry_after_seconds: { type: [integer, "null"], minimum: 1 }
