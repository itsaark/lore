openapi: 3.1.0
info:
  title: Lore Processing API
  version: 1.0.0
  description: Request-ephemeral transcription and grounded daily-entry processing.
servers:
  - url: https://lore-api.example.invalid
paths:
  /v1/health:
    get:
      operationId: health
      responses:
        "200":
          description: Content-free service status.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status, api_schema_versions, model_aliases]
                properties:
                  status: { const: ok }
                  api_schema_versions:
                    type: array
                    items: { type: string }
                  model_aliases:
                    type: array
                    items: { type: string }
  /v1/auth/challenges:
    post:
      operationId: createAppAttestChallenge
      description: Issues a randomized single-use challenge. Assertion challenges are bound to an opaque App Attest key reference.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChallengeRequest"
      responses:
        "200":
          description: A challenge that expires within five minutes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChallengeResponse"
        default:
          $ref: "#/components/responses/ApiError"
  /v1/auth/attestations:
    post:
      operationId: registerAppAttestKey
      description: Atomically consumes an attestation challenge, registers verified key state, and issues an anonymous installation session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttestationRequest"
      responses:
        "200":
          description: Short-lived anonymous installation session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        default:
          $ref: "#/components/responses/ApiError"
  /v1/auth/sessions:
    post:
      operationId: renewAppAttestSession
      description: Verifies a fresh App Attest assertion and atomically consumes its challenge while advancing the key counter.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionRequest"
      responses:
        "200":
          description: Renewed short-lived anonymous installation session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        default:
          $ref: "#/components/responses/ApiError"
  /v1/transcriptions:
    post:
      operationId: createTranscription
      description: Provider-neutral request contract currently fulfilled by direct Groq Whisper transcription.
      security: [{ bearerSession: [] }]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/TranscriptionMultipart"
      responses:
        "200":
          description: One validated transcription chunk.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemoteTranscriptionResponse"
        "409":
          $ref: "#/components/responses/ApiError"
        default:
          $ref: "#/components/responses/ApiError"
  /v1/daily-entries:
    post:
      operationId: createDailyEntry
      description: Provider-neutral request contract currently fulfilled by direct Fireworks Chat Completions.
      security: [{ bearerSession: [] }]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: >-
                DailyEntryGenerationRequest v1.0. Remembered time can be a dated range or the strict
                object {precision: as_spoken} for a memory placed in time by the speaker's own words.
                Canonical validation lives in src/contracts/daily-entry.ts.
      responses:
        "200":
          description: Schema-validated grounded daily entry.
          content:
            application/json:
              schema:
                type: object
                description: DailyEntryGenerationResponse v1.0; canonical validation lives in src/contracts/daily-entry.ts.
        "409":
          $ref: "#/components/responses/ApiError"
        default:
          $ref: "#/components/responses/ApiError"
  /v1/memory-anchors:
    post:
      operationId: createMemoryAnchor
      description: >-
        Identifies the speaker's time reference when a note mainly recalls an earlier time.
        The Idempotency-Key must equal memory-anchor:<job_id lowercased>.
      security: [{ bearerSession: [] }]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        description: The JSON body may be at most 200,000 bytes.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemoryAnchorRequest"
      responses:
        "200":
          description: A structured time reference or an anchor of kind none, with Fireworks provenance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryAnchorResponse"
        "409":
          $ref: "#/components/responses/ApiError"
        default:
          $ref: "#/components/responses/ApiError"
  /v1/story-chapters:
    post:
      operationId: createStoryChapter
      description: Writes one month's autobiography chapter from the person's finished daily entries, through the same grounded writer as daily entries.
      security: [{ bearerSession: [] }]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: StoryChapterGenerationRequest v1.0; canonical validation lives in src/contracts/story-chapter.ts.
      responses:
        "200":
          description: Schema-validated grounded chapter, citing source day ids.
          content:
            application/json:
              schema:
                type: object
                description: StoryChapterGenerationResponse v1.0; canonical validation lives in src/contracts/story-chapter.ts.
        "409":
          $ref: "#/components/responses/ApiError"
        default:
          $ref: "#/components/responses/ApiError"
  /v1/day-illustrations:
    post:
      operationId: createDayIllustration
      description: >-
        Creates a portrait placeholder cover from a finished daily entry.
        Fireworks receives the title and prose and writes a de-identified scene.
        OpenAI receives only the scene and a fixed painting prompt.
        The Idempotency-Key must equal day-illustration:<job_id lowercased>.
      security: [{ bearerSession: [] }]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        description: The JSON body may be at most 200,000 bytes.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DayIllustrationGenerationRequest"
      responses:
        "200":
          description: Portrait JPEG, de-identified scene, and processing provenance for each provider.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DayIllustrationGenerationResponse"
        "400":
          $ref: "#/components/responses/ApiError"
        "409":
          $ref: "#/components/responses/ApiError"
        "413":
          $ref: "#/components/responses/ApiError"
        "415":
          $ref: "#/components/responses/ApiError"
        "422":
          description: OpenAI moderation refusal or a Fireworks scene containing digits. Returns invalid_provider_response with retryable set to false.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        default:
          $ref: "#/components/responses/ApiError"
  /v1/reflections/session-credentials:
    post:
      operationId: createReflectionSessionCredentials
      description: Mints separate single-use Soniox credentials for one STT and one TTS WebSocket connection.
      security: [{ bearerSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: ReflectionSessionCredentialsRequest v1.0; canonical validation lives in src/contracts/reflection.ts.
      responses:
        "200":
          description: Two short-lived capability-scoped credentials and provider endpoints.
          content:
            application/json:
              schema:
                type: object
                description: ReflectionSessionCredentialsResponse v1.0.
        default:
          $ref: "#/components/responses/ApiError"
  /v1/reflections/respond:
    post:
      operationId: createReflectionGuideTurn
      description: Generates one bounded, structured follow-up question from committed reflection turns.
      security: [{ bearerSession: [] }]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: ReflectionGuideRequest v1.0; canonical validation lives in src/contracts/reflection.ts.
      responses:
        "200":
          description: One validated spoken response and finish recommendation.
          content:
            application/json:
              schema:
                type: object
                description: ReflectionGuideResponse v1.0.
        default:
          $ref: "#/components/responses/ApiError"
  /v1/reflections/finalize:
    post:
      operationId: finalizeReflection
      description: Creates a third-person grounded biography entry using only user source segments as evidence.
      security: [{ bearerSession: [] }]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: ReflectionFinalizationRequest v1.0; canonical validation lives in src/contracts/reflection.ts.
      responses:
        "200":
          description: Existing DailyEntryGenerationResponse v1.0 with third-person grounded prose.
          content:
            application/json:
              schema:
                type: object
                description: Canonical validation lives in src/contracts/daily-entry.ts.
        "409":
          $ref: "#/components/responses/ApiError"
        default:
          $ref: "#/components/responses/ApiError"
components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Bounded caller job identity. Daily entry requires `daily-entry:<job_id>`; transcription must exactly match the multipart field.
      schema:
        type: string
        minLength: 8
        maxLength: 200
        pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]*$"
  securitySchemes:
    bearerSession:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Short-lived HS256 token issued only after production App Attest attestation or assertion verification. Static application bearer credentials are not accepted.
  responses:
    ApiError:
      description: Stable content-free error response.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
  schemas:
    ChallengeRequest:
      type: object
      additionalProperties: false
      required: [schema_version, purpose, key_id]
      properties:
        schema_version: { const: "1.0" }
        purpose: { enum: [attestation, assertion] }
        key_id:
          type: [string, "null"]
          description: Canonical standard-base64 32-byte key identifier; required only for assertion challenges.
    ChallengeResponse:
      type: object
      additionalProperties: false
      required: [schema_version, challenge_id, challenge, purpose, expires_at]
      properties:
        schema_version: { const: "1.0" }
        challenge_id: { type: string, format: uuid }
        challenge: { type: string, description: Base64url text hashed as UTF-8 by the App Attest client. }
        purpose: { enum: [attestation, assertion] }
        expires_at: { type: string, format: date-time }
    AttestationRequest:
      type: object
      additionalProperties: false
      required: [schema_version, challenge_id, challenge, key_id, attestation_object]
      properties:
        schema_version: { const: "1.0" }
        challenge_id: { type: string, format: uuid }
        challenge: { type: string }
        key_id: { type: string }
        attestation_object: { type: string, contentEncoding: base64 }
    SessionRequest:
      type: object
      additionalProperties: false
      required: [schema_version, challenge_id, challenge, key_id, assertion_object, client_data]
      properties:
        schema_version: { const: "1.0" }
        challenge_id: { type: string, format: uuid }
        challenge: { type: string }
        key_id: { type: string }
        assertion_object: { type: string, contentEncoding: base64 }
        client_data:
          type: string
          contentEncoding: base64
          description: Exact UTF-8 JSON bytes signed by App Attest; strict schema is {schema_version, action=create_session, challenge_id, challenge}.
    SessionResponse:
      type: object
      additionalProperties: false
      required: [schema_version, token_type, session_token, expires_at]
      properties:
        schema_version: { const: "1.0" }
        token_type: { const: Bearer }
        session_token: { type: string }
        expires_at: { type: string, format: date-time }
    RetentionPolicy:
      type: object
      additionalProperties: false
      required: [mode, maximum_retention_seconds]
      properties:
        mode: { const: request_ephemeral }
        maximum_retention_seconds: { const: 0 }
    TranscriptionMultipart:
      type: object
      additionalProperties: false
      required:
        - audio
        - schema_version
        - job_id
        - idempotency_key
        - chunk_id
        - chunk_index
        - chunk_count
        - start_milliseconds
        - duration_milliseconds
        - vocabulary_hints
        - retention_policy
      properties:
        audio: { type: string, contentEncoding: binary }
        schema_version: { const: "1.0" }
        job_id: { type: string, format: uuid }
        idempotency_key:
          type: string
          minLength: 8
          maxLength: 200
          pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]*$"
          description: Must exactly match the Idempotency-Key header.
        chunk_id: { type: string }
        chunk_index: { type: integer, minimum: 0 }
        chunk_count: { type: integer, minimum: 1 }
        start_milliseconds: { type: integer, minimum: 0 }
        duration_milliseconds: { type: integer, minimum: 1 }
        language_code: { type: [string, "null"] }
        vocabulary_hints: { type: string, description: JSON-encoded bounded string array. }
        retention_policy: { type: string, description: JSON-encoded RetentionPolicy. }
    RemoteTranscriptionResponse:
      type: object
      description: Canonical strict schema lives in src/contracts/transcription.ts.
    MemoryAnchorRequest:
      type: object
      additionalProperties: false
      required: [schema_version, prompt_version, job_id, captured_local_date, language_code, transcript, retention_policy]
      properties:
        schema_version: { const: "1.0" }
        prompt_version: { const: memory-anchor-v1 }
        job_id: { type: string, format: uuid }
        captured_local_date: { type: string, format: date }
        language_code: { type: string, minLength: 2, maxLength: 35 }
        transcript: { type: string, minLength: 1, maxLength: 20000 }
        retention_policy:
          $ref: "#/components/schemas/RetentionPolicy"
    MemoryAnchorResponse:
      type: object
      additionalProperties: false
      required: [schema_version, prompt_version, job_id, request_id, anchor, provenance]
      properties:
        schema_version: { const: "1.0" }
        prompt_version: { const: memory-anchor-v1 }
        job_id: { type: string, format: uuid }
        request_id: { type: string, minLength: 1, maxLength: 200 }
        anchor:
          description: Range endpoints are inclusive and ordered. Calendar years may be no later than the captured year.
          oneOf:
            - type: object
              additionalProperties: false
              required: [kind]
              properties:
                kind: { const: none }
            - type: object
              additionalProperties: false
              required: [kind, start_year, end_year]
              properties:
                kind: { const: year }
                start_year: { type: integer, minimum: 1900 }
                end_year: { type: integer, minimum: 1900 }
            - type: object
              additionalProperties: false
              required: [kind, min_years, max_years]
              properties:
                kind: { const: years_ago }
                min_years: { type: integer, minimum: 1, maximum: 100 }
                max_years: { type: integer, minimum: 1, maximum: 100 }
            - type: object
              additionalProperties: false
              required: [kind, start_age, end_age]
              properties:
                kind: { const: age }
                start_age: { type: integer, minimum: 0, maximum: 120 }
                end_age: { type: integer, minimum: 0, maximum: 120 }
            - type: object
              additionalProperties: false
              required: [kind, stage]
              properties:
                kind: { const: life_stage }
                stage: { enum: [early_childhood, school_years, teenage_years, college_years, first_jobs] }
        provenance:
          type: object
          description: ProcessingProvenance as defined in src/contracts/common.ts.
          required: [provider_id, model_alias]
          properties:
            provider_id: { const: fireworks }
            model_alias: { const: memory-anchor-v1 }
    DayIllustrationGenerationRequest:
      type: object
      additionalProperties: false
      required: [schema_version, prompt_version, job_id, day_key, language_code, title, prose, retention_policy]
      properties:
        schema_version: { const: "1.0" }
        prompt_version: { const: day-illustration-v1 }
        job_id: { type: string, format: uuid }
        day_key: { type: string, format: date }
        language_code: { type: string, minLength: 2, maxLength: 35 }
        title: { type: string, maxLength: 200 }
        prose: { type: string, minLength: 1, maxLength: 20000 }
        retention_policy:
          type: object
          additionalProperties: false
          required: [mode, maximum_retention_seconds]
          properties:
            mode: { const: request_ephemeral }
            maximum_retention_seconds: { const: 0 }
    DayIllustrationGenerationResponse:
      type: object
      additionalProperties: false
      required: [schema_version, prompt_version, job_id, request_id, image, scene, scene_provenance, provenance]
      properties:
        schema_version: { const: "1.0" }
        prompt_version: { const: day-illustration-v1 }
        job_id: { type: string, format: uuid }
        request_id: { type: string }
        image:
          type: object
          additionalProperties: false
          required: [media_type, data_base64, pixel_width, pixel_height]
          properties:
            media_type: { const: image/jpeg }
            data_base64: { type: string, contentEncoding: base64, minLength: 1, maxLength: 2500000 }
            pixel_width: { const: 1024 }
            pixel_height: { const: 1536 }
        scene:
          type: object
          additionalProperties: false
          required: [description]
          properties:
            description: { type: string, minLength: 40, maxLength: 800 }
        scene_provenance:
          type: object
          description: ProcessingProvenance as defined in src/contracts/common.ts.
          required: [provider_id, model_alias]
          properties:
            provider_id: { const: fireworks }
            model_alias: { const: day-scene-v1 }
        provenance:
          type: object
          description: ProcessingProvenance as defined in src/contracts/common.ts.
          required: [provider_id, model_alias]
          properties:
            provider_id: { const: openai }
            model_alias: { const: day-illustration-v1 }
    ApiError:
      type: object
      additionalProperties: false
      required: [schema_version, request_id, error, retry_after_seconds]
      properties:
        schema_version: { const: "1.0" }
        request_id: { type: string }
        error:
          type: object
          additionalProperties: false
          required: [code, message, retryable]
          properties:
            code: { type: string }
            message: { type: string }
            retryable: { type: boolean }
        retry_after_seconds: { type: [integer, "null"], minimum: 1 }
